<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brief">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Howard 모닝 마켓 브리핑</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--fill:#F2F2F7;--label:#000;--label2:rgba(60,60,67,.62);--label3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.14);--blue:#007AFF;--green:#34C759;--greenT:#248A3D;--red:#FF3B30;--redT:#D70015;--orange:#FF9500;--indigo:#5856D6;
  --gpill:rgba(52,199,89,.14);--rpill:rgba(255,59,48,.12);--npill:rgba(120,120,128,.14);--bar:rgba(242,242,247,.8)
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1C1C1E;--fill:#2C2C2E;--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6);--blue:#0A84FF;--green:#30D158;--greenT:#30D158;--red:#FF453A;--redT:#FF6961;--orange:#FF9F0A;--indigo:#5E5CE6;
  --gpill:rgba(48,209,88,.18);--rpill:rgba(255,69,58,.2);--npill:rgba(120,120,128,.28);--bar:rgba(0,0,0,.72)
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:110px}
body{margin:0;background:var(--bg);color:var(--label);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}
.num{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* large title */
.hero{padding:22px 4px 8px}
.eyebrow{font-size:13px;font-weight:600;color:var(--label2);text-transform:none;letter-spacing:.01em}
h1{font-size:34px;font-weight:700;letter-spacing:-.025em;margin:2px 0 0;line-height:1.15}

/* sticky segmented nav */
.nav{position:sticky;top:0;z-index:10;margin:8px -16px 0;padding:10px 16px 10px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg a{flex:none;font-size:13.5px;font-weight:600;color:var(--label);text-decoration:none;background:var(--card);border-radius:999px;padding:7px 14px;box-shadow:0 0 0 .5px var(--sep)}
.seg a:active{opacity:.6}

/* section header */
.sh{display:flex;align-items:baseline;justify-content:space-between;margin:28px 4px 8px}
.sh h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.sh span{font-size:13px;color:var(--label2)}

/* market tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--card);border-radius:18px;padding:14px 16px 15px;min-width:0}
.tile.wide{grid-column:span 2;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.tile .k{font-size:13px;font-weight:600;color:var(--label2)}
.tile .v{font-size:28px;font-weight:700;margin-top:4px;line-height:1.1}
.tile.wide .v{font-size:40px}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:3px 9px;border-radius:8px;margin-top:8px;white-space:nowrap}
.pill.up{background:var(--gpill);color:var(--greenT)}.pill.down{background:var(--rpill);color:var(--redT)}.pill.flat{background:var(--npill);color:var(--label2)}
.tile.wide .pill{font-size:15px;padding:5px 11px;margin:0 0 4px}

/* summary */
.card{background:var(--card);border-radius:18px;overflow:hidden}
.sum{padding:16px 18px}
.sum h3{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin:0 0 10px;color:var(--label)}
.sum h3 i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#FF9500,#FF5E3A);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:13px}
.sum ol{margin:0;padding:0;list-style:none;counter-reset:s}
.sum li{counter-increment:s;position:relative;padding:0 0 0 30px;margin:0 0 10px;font-size:15px}
.sum li:last-child{margin-bottom:0}
.sum li::before{content:counter(s);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;background:var(--fill);color:var(--label2);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* grouped list (calendar & links) */
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row .when{flex:none;width:78px;font-size:13px;font-weight:600;color:var(--blue)}
.row .when b{display:block;color:var(--label);font-size:15px}
.row .what{font-size:14.5px}
.row .what small{display:block;color:var(--label2);font-size:13px}
.foot{font-size:12.5px;color:var(--label2);margin:8px 16px 0}
.foot a{color:var(--blue);text-decoration:none}

/* indicator */
.ind{background:var(--card);border-radius:18px;margin-bottom:12px;overflow:hidden}
.ind .top{padding:15px 16px 0}
.ih{display:flex;align-items:center;gap:10px}
.rk{flex:none;width:26px;height:26px;border-radius:8px;background:var(--fill);color:var(--label2);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ind.hot .rk{background:var(--blue);color:#fff}
.it{font-size:16px;font-weight:600;letter-spacing:-.01em}
.badge{margin-left:auto;flex:none;font-size:12px;font-weight:600;color:var(--label2);background:var(--fill);border-radius:999px;padding:3px 9px}
.badge.alert{color:var(--orange);background:rgba(255,149,0,.14)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:4px 16px;margin:14px 0 2px}
.st .k{font-size:12.5px;color:var(--label2);font-weight:500}
.st .v{font-size:30px;font-weight:700;line-height:1.15;margin-top:2px}
.st .v{white-space:nowrap}.st .v.sm{font-size:24px}
.st .v.up{color:var(--greenT)}.st .v.down{color:var(--redT)}
.st .d{font-size:13px;color:var(--label2);margin-top:1px}
.st .d.up{color:var(--greenT)}.st .d.down{color:var(--redT)}.st .d.act{color:var(--orange)}
.note{font-size:14.5px;line-height:1.55;color:var(--label);margin:12px 0 14px;opacity:.88}
.links{border-top:.5px solid var(--sep)}
.links a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;color:var(--blue);text-decoration:none;font-size:14.5px;position:relative}
.links a+a::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.links a::after{content:"›";color:var(--label3);font-size:20px;line-height:1;font-weight:400}
.links a:active{background:var(--fill)}

.tip{background:rgba(0,122,255,.08);border-radius:12px;padding:10px 12px;margin:-4px 0 14px;font-size:14px;line-height:1.55}
.tip span{display:block;font-size:12px;font-weight:700;color:var(--blue);margin-bottom:2px}
@media (prefers-color-scheme:dark){.tip{background:rgba(10,132,255,.16)}}
/* 긴 종목 문자열이 박스 밖으로 넘치지 않게 */
.ind,.ind .top,.tip,.note,.card,.sum li,.row .what{min-width:0}
.tip,.note,.sum li,.row .what,.foot{word-break:keep-all;overflow-wrap:anywhere}
footer{text-align:center;color:var(--label2);font-size:12px;margin:30px 0 10px;line-height:1.6}

/* live bar + charts */
.livebar{display:flex;align-items:center;gap:10px;margin:16px 4px 0}
.livebar .lt{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.livebar .lt b{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--label3);flex:none}
.dot.on{background:var(--green);box-shadow:0 0 0 3px var(--gpill);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}
#lstat{font-size:12px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lstat.err{color:var(--orange)}
.rng{display:flex;background:var(--npill);border-radius:9px;padding:2px}
.rng button{font:600 12.5px -apple-system,system-ui,sans-serif;border:0;background:transparent;color:var(--label);padding:5px 11px;border-radius:7px;cursor:pointer}
.rng button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
#refresh{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,122,255,.3)}
#refresh:active{transform:scale(.92)}
#refresh svg{width:18px;height:18px}
#refresh.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#refresh[hidden]{display:none}
.tile.wide{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:center;gap:12px}
.tile.wide .v{font-size:29px}
.tile.wide .pill{font-size:14px;padding:4px 10px;margin:8px 0 0}
.chartbox{position:relative;height:74px}
.spark{display:block;width:100%;height:100%;overflow:visible}
.chartcap{position:absolute;right:0;bottom:-16px;font-size:11px;color:var(--label2);white-space:nowrap}
.tile.flash .v{animation:flash 1s}
@keyframes flash{0%{opacity:.35}100%{opacity:1}}
@media
