*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:110px}
body{margin:0;background:var(--bg);color:var(--label);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;

.sh span{font-size:13px;color:var(--label2)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--card);border-radius:18px;padding:14px 16px 15px;min-width:0}

.tile.wide .pill{font-size:12.5px;padding:5px 11px;margin:0 0 4px}

.card{background:var(--card);border-radius:18px;overflow:hidden}
.sum{padding:16px 18px}
.sum h3{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:0 0 10px;color:var(--label)}
.sum h3 i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#FF9500,#FF5E3A);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:13px}
.sum ol{margin:0;padding:0;list-style:none;counter-reset:s}
.sum li{counter-increment:s;position:relative;padding:0 0 0 30px;margin:0 0 10px;font-size:14px}
.sum li:last-child{margin-bottom:0}
.sum li::before{content:counter(s);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;background:var(--fill);color:var(--label2);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}

.row{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row .when{flex:none;width:78px;font-size:13px;font-weight:600;color:var(--blue)}

.row .what{font-size:14px}
.row .what small{display:block;color:var(--label2);font-size:13px}
.foot{font-size:12.5px;color:var(--label2);margin:8px 16px 0}
.foot a{color:var(--blue);text-decoration:none}

.ind{background:var(--card);border-radius:18px;margin-bottom:12px;overflow:hidden}
.ind .top{padding:15px 16px 0}
.ih{display:flex;align-items:center;gap:10px}

.it{font-size:15px;font-weight:600;letter-spacing:-.01em}

.st .d.up{color:var(--greenT)}.st .d.down{color:var(--redT)}.st .d.act{color:var(--orange)}

.links a::after{content:"›";color:var(--label3);font-size:20px;line-height:1;font-weight:400}
.links a:active{background:var(--fill)}

footer{text-align:center;color:var(--label2);font-size:12px;margin:30px 0 10px;line-height:1.6}

/* live bar + charts */
.livebar{display:flex;align-items:center;gap:10px;margin:16px 4px 0}
.livebar .lt{display:flex;flex-direction:column;margin-right:auto;min-width:0}

.rng{display:flex;background:var(--npill);border-radius:9px;padding:2px}

.tile.wide{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:center;gap:12px}

.chartbox{position:relative;height:74px}

.chartcap{position:absolute;right:0;bottom:-16px;font-size:11px;color:var(--label2);white-space:nowrap}

.loading{text-align:center;color:var(--label2);padding:40px 0;font-size:14px}
.errbox{background:var(--card);border-radius:18px;padding:16px 18px;color:var(--orange);font-size:14px;margin-top:14px}

    '<path d="'+line+' L'+W+' '+H+' L0 '+H+' Z" fill="url(#'+id+')"/>'+
    '<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'+
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.2" fill="'+col+'"/>';
  var rl=range==="1D"?"1M":range,pc=(vals[vals.length-1]/vals[0]-1)*100; cap.textContent=(range==="1D"?"장중 데이터 대기 · ":"")+rl+" "+sign(pc,1,"%"); cap.style.color=up?"var(--greenT)":"var(--redT)";
}
function loadLive(){
  if(busy)return; busy=true; btn.classList.add("spin"); setStat("불러오는 중…");
  Promise.all([gviz(GID.quotes,"A2:F7"),gviz(GID.history,"A2:I400"),gviz(GID.intraday,"A2:F200").catch(function(){return null})]).then(function(r){
    if(r[2]&&r[2].rows){var ia={SP500:[],TSX:[]};
      r[2].rows.forEach(function(row){var c=row.c||[];
        [["SP500",0],["TSX",3]].forEach(function(z){var d=cell(c[z[1]]),m=cell(c[z[1]+1]),v=cell(c[z[1]+2]);if(d&&m!=null&&v!=null)ia[z[0]].push({d:+d,m:+m,c:+v})})});
      ["SP500","TSX"].forEach(function(k){var a=ia[k];if(!a.length){intra[k]=[];return}
        var dmax=Math.max.apply(0,a.map(function(x){return x.d})),seen={};
        intra[k]=a.filter(function(x){if(x.d!==dmax||seen[x.m])return false;seen[x.m]=1;return true}).sort(function(x,y){return x.m-y.m})});}
    r[0].rows.forEach(function(row){var c=row.c;var k=cell(c[0]);if(!k)return;
      var ts=String(cell(c[5])||""),tm=/(\d{1,2}):(\d{2})/.exec(ts.slice(10));
      quotes[k]={price:cell(c[2]),chg:cell(c[3]),prev:cell(c[4]),date:ts.slice(0,10),min:tm?(+tm[1])*60+(+tm[2]):null}});
    var sp=[],tx=[],wsp=[],wtx=[];
    r[1].rows.forEach(function(row){var c=row.c;
      if(cell(c[0])&&cell(c[1])!=null)sp.push({d:gdate(cell(c[0])),c:cell(c[1])});
      if(c[2]&&cell(c[2])&&cell(c[3])!=null)tx.push({d:gdate(cell(c[2])),c:cell(c[3])});
      if(c[5]&&cell(c[5])&&c[6]&&cell(c[6])!=null)wsp.push({d:gdate(cell(c[5])),c:cell(c[6])});
      if(c[7]&&cell(c[7])&&c[8]&&cell(c[8])!=null)wtx.push({d:gdate(cell(c[7])),c:cell(c[8])})});
    if(sp.length)hist.SP500=sp; if(tx.length)hist.TSX=tx; if(wsp.length)histW.SP500=wsp; if(wtx.length)histW.TSX=wtx;
    renderTiles();
    setStat(new Date().toLocaleTimeString("ko-KR",{hour:"numeric",minute:"2-digit"})+" 업데이트 · 최대 20분 지연");
  }).catch(function(){setStat("시세를 불러오지 못했어요 · ↻ 를 눌러 다시 시도",true)})
  .then(function(){busy=false;btn.classList.remove("spin")});
}

/* ---------- 브리핑 본문 ---------- */
function statHtml(s){return '<div class="st"><div class="k">'+esc(s.k)+'</div><div class="v num'+(s.vc?" "+s.vc:"")+(s.sm?" sm":"")+'">'+esc(s.v)+'</div>'+(s.d?'<div class="d'+(s.dc?" "+s.dc:"")+'">'+esc(s.d)+'</div>':"")+'</div>'}
function cardHtml(c){
  return '<div class="ind'+(c.hot?" hot":"")+'"><div class="top"><div class="ih"><span class="rk">'+esc(c.rk)+'</span><span class="it">'+esc(c.name)+'</span>'+
    (c.badge?'<span class="badge'+(c.alert?" alert":"")+'">'+esc(c.badge)+'</span>':"")+'</div>'+
    '<div class="stats">'+(c.stats||[]).map(statHtml).join("")+'</div><p class="note">'+esc(c.note)+'</p>'+(c.tip?'<div class="tip"><span>내 포트폴리오엔</span>'+esc(c.tip)+'</div>':'')+'</div>'+
    ((c.links&&c.links.length)?'<div class="links">'+c.links.map(function(l){return '<a href="'+esc(safeUrl(l.u))+'" target="_blank" rel="noopener">'+esc(l.t)+'</a>'}).join("")+'</div>':"")+'</div>';
}
var firstRender=true;
function renderBrief(d){
  var y=window.scrollY;
  $("#eyebrow").textContent=d.eyebrow||""; $("#title").textContent=d.title||"마켓 브리핑";
  if(!Object.keys(quotes).length&&d.tiles)Object.keys(d.tiles).forEach(function(k){var t=d.tiles[k],el=document.querySelector('[data-q="'+k+'"]');if(!el)return;
    $('[data-f="v"]',el).textContent=t.v;var pe=$('[data-f="p"]',el);pe.textContent=t.p;pe.className="pill num "+(t.c||"flat")});
  var h='';
  if(d.market&&d.market.length)h+='<div class="sh"><h2>오늘의 시장</h2></div><div class="card sum">'+(d.marketAsOf?'<div style="font-size:12.5px;color:var(--label2);margin:0 0 10px">'+esc(d.marketAsOf)+'</div>':'')+'<ol>'+d.market.map(function(s){return "<li>"+bold(s)+"</li>"}).join("")+'</ol></div>';
  h+='<div class="sh"><h2>오늘의 요약</h2></div><div class="card sum"><h3><i>★</i>꼭 알아야 할 3가지</h3><ol>'+(d.summary||[]).map(function(s){return "<li>"+bold(s)+"</li>"}).join("")+'</ol></div>';
  (d.sections||[]).forEach(function(s){
    h+='<div class="sh" id="'+esc(s.id)+'"><h2>'+esc(s.title)+'</h2><span>'+esc(s.num)+'</span></div>';
    if(!s.cards||!s.cards.length)h+='<div class="card sum">오늘은 눈에 띄는 뉴스가 없어요.</div>';
    else h+=s.cards.map(cardHtml).join("");
  });
  h+='<div class="sh" id="calendar"><h2>이번 주 일정</h2><span>밴쿠버 시각</span></div><div class="card">'+
    (d.calendar||[]).map(function(r){return '<div class="row"><div class="when"><b>'+esc(r.day)+'</b>'+esc(r.time)+'</div><div class="what">'+esc(r.what)+(r.small?'<small>'+esc(r.small)+'</small>':"")+'</div></div>'}).join("")+'</div>';
  if(d.calsrc&&d.calsrc.length)h+='<p class="foot">출처 · '+d.calsrc.map(function(l){return '<a href="'+esc(safeUrl(l.u))+'" target="_blank" rel="noopener">'+esc(l.t)+'</a>'}).join(" · ")+'</p>';
  $("#brief").innerHTML=h;
  $("#foot").innerHTML=(d.footer||[]).map(esc).join("<br>");
  fitAll();
  if(!firstRender)window.scrollTo(0,y);
  firstRender=false;
}
function loadBrief(){
  return gviz(GID.brief,"A1").then(function(t){
    var raw=t.rows&&t.rows[0]&&cell(t.rows[0].c[0]); var d=JSON.parse(raw);
    renderBrief(d); try{localStorage.setItem("brief",raw)}catch(e){}
  }).catch(function(){
    if(!$("#brief .ind"))$("#brief").innerHTML='<div class="errbox">브리핑을 불러오지 못했어요. 인터넷 연결을 확인하고 ↻ 를 눌러 주세요.</div>';
  });
}
try{var c=localStorage.getItem("brief");if(c)renderBrief(JSON.parse(c))}catch(e){}

$("#rng").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;range=b.getAttribute("data-r");
  Array.prototype.forEach.call(this.children,function(x){x.classList.toggle("on",x===b)});["SP500","TSX"].forEach(drawChart)});
btn.addEventListener("click",function(){loadLive();loadBrief()});
$(".seg").addEventListener("click",function(ev){var a=ev.target.closest("a");if(!a)return;ev.preventDefault();var t=document.getElementById(a.getAttribute("href").slice(1));if(t)t.scrollIntoView({behavior:"smooth",block:"start"})});
if(location.hash)history.replaceState(null,"",location.pathname+location.search);
loadBrief(); loadLive();
setInterval(function(){if(!document.hidden)loadLive()},120000);
document.addEventListener("visibilitychange",function(){if(!document.hidden){loadLive();loadBrief()}});
})();
</script>
